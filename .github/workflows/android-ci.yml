name: Android CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Build, unit tests, compile instrumented tests, and assemble debug APK
        run: gradle --no-daemon clean test assembleDebug compileDebugAndroidTestKotlin

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: sistem-kas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
